name: Validate and release skills

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate definitions
        shell: pwsh
        run: .\scripts\Test-Skills.ps1
      - name: Build and verify ZIPs
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v0.0.0' }
          .\scripts\New-SkillPackages.ps1 -Version $version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skill-packages
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: skill-packages
          path: dist
      - name: Verify downloaded packages
        shell: pwsh
        run: .\scripts\Test-Skills.ps1 -PackageDirectory .\dist -Version $env:GITHUB_REF_NAME
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath .\dist -File | Select-Object -ExpandProperty FullName)
          $notes = "Nine independent PowerPoint custom skills. Download the bundle for manual OneDrive installation, or an individual ZIP for Add skill. Includes MIT license and SHA-256 checksums. / 9個のカスタムスキル。一括ZIPは展開してOneDriveへ、個別ZIPはスキルの追加から導入できます。See README.md / README.ja.md for instructions."
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "PowerPoint Agent Skills $env:GITHUB_REF_NAME" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
